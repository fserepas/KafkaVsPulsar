# Cluster name
clusterName=pulsar-cluster

# Configure managed ledger settings for standalone mode
managedLedgerDefaultEnsembleSize=1
managedLedgerDefaultWriteQuorum=1
managedLedgerDefaultAckQuorum=1

# Disable auto deletion of topics
brokerDeleteInactiveTopicsEnabled=false

# Broker ports
brokerServicePort=6650
webServicePort=8080
advertisedAddress=pulsar
functionInstancePortRange=46000-46010

# MQTT protocol handler
protocolHandlerDirectory=./protocols
messagingProtocols=mqtt
mqttListeners=mqtt://0.0.0.0:1883
mqttAdvertisedListeners=mqtt://0.0.0.0:1883
mqttProtocolHandlerEnabled=true
mqttAllowUnsubscribePersistentTopics=true
mqttPersistentTopicType=persistent

# Enable functions worker
functionsWorkerEnabled=true

# Enable schema validation
isSchemaValidationEnforced=true
